[project]
name = "rotary-inverted-pendulum"
version = "0.1.0"
description = "MuJoCo simulation of a rotary inverted pendulum with swing-up, proportional, and hybrid controllers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0",
    "jinja2>=3.1",
    "numpy>=1.24",
    "matplotlib>=3.10.9",
    "scipy>=1.15.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sim"]
